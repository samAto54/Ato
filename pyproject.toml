[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ato-agent"
version = "0.1.0"
description = "A modular, LLM-powered personal AI agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.0",
    "pypdf>=5.0",
    "python-docx>=1.1",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "reportlab>=4.0", "ruff>=0.9"]
voice = ["sounddevice>=0.5"]

[project.scripts]
ato = "ato.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ato"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
markers = ["live_network: opt-in tests that make real external HTTPS requests"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
